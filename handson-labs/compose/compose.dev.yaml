# Development Environment
# Usage: docker compose -f compose.dev.yaml up

include:
  - compose.observability.yaml
  - compose.app.yaml

services:
  frontend:
    build:
      context: ../app-versions/code/frontend
      dockerfile: Dockerfile.dev
      target: development
    volumes:
      # Mount source code for hot reload
      - ../app-versions/code/frontend/src:/app/src:ro
      - ../app-versions/code/frontend/tsconfig.json:/app/tsconfig.json:ro
    environment:
      - NODE_ENV=development
      - LOG_LEVEL=debug
      - CHOKIDAR_USEPOLLING=true
      - CHOKIDAR_INTERVAL=1000      
      - NODE_OPTIONS=--experimental-loader=@opentelemetry/instrumentation/hook.mjs
    command: npm run dev

  worker:
    build:
      context: ../app-versions/code/worker
      dockerfile: Dockerfile.dev
    volumes:
      # Mount source code for hot reload
      - ../app-versions/code/worker/src:/app/src:ro
      # Preserve translation models (large, slow to download)
      - worker-models:/root/.local/share/argos-translate
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=debug
      # - LOG_LEVEL=info
    # command: watchmedo auto-restart --directory=./src --pattern="*.py" --recursive -- python -m src.main
    command: >
      watchmedo auto-restart
      --directory=./src
      --pattern="*.py"
      --recursive
      --debug-force-polling
      -- python -m src.main    

volumes:
  worker-models:

networks:
  observability:
    driver: bridge
    name: observability
  app:
    driver: bridge
    name: app

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp: # OpenTelemetry Protocol
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces
    wal:
      path: /var/tempo/wal

query_frontend:
  search:
    max_duration: 0s
ingester:
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 72h

# Required by Grafana Trace Drilldown for TraceQL metrics queries such as
# `{ } | rate()` and `{ } | count_over_time()` in Tempo 2.x.
metrics_generator:
  # Dedicated WAL and trace data paths required by the local-blocks processor.
  storage:
    path: /var/tempo/generator/wal
  traces_storage:
    path: /var/tempo/generator/traces
  processor:
    local_blocks:
      filter_server_spans: false

overrides:
  defaults:
    metrics_generator:
      processors:
        - local-blocks

services:
  prometheus:
    image: prom/prometheus:v3.9.1
    container_name: prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yaml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - prometheus-data:/prometheus
    ports:
      - '9100:9090' # Change 9100 for Prometheus
    networks:
      - observability
    restart: unless-stopped

  loki:
    image: grafana/loki:3.6.6
    container_name: loki
    user: root
    command:
      - '-config.file=/etc/loki/loki.yaml'
      - '-target=all'
    volumes:
      - ./loki-config.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
      - loki-wal:/wal
    ports:
      - '3110:3100' # Change to 3110 for Loki
    networks:
      - observability
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.10.1
    container_name: tempo
    command:
      - '-config.file=/etc/tempo/tempo.yaml'
      - '-target=all'
    volumes:
      - ./tempo-config.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - '3200:3200' # Tempo HTTP API and query port
      - '4317:4317' # OTLP gRPC receiver
      - '4318:4318' # OTLP HTTP receiver
    networks:
      - observability
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.3
    container_name: grafana
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - grafana-data:/var/lib/grafana
    ports:
      - '3010:3000' # Change to 3010 for Grafana
    networks:
      - observability
    restart: unless-stopped
    depends_on:
      - prometheus
      - loki
      - tempo

volumes:
  prometheus-data:
  loki-data:
  loki-wal:
  tempo-data:
  grafana-data:

networks:
  observability:
    driver: bridge

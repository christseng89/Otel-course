mode: deployment
replicaCount: 1
fullnameOverride: otel-collector
image:
  repository: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib
  tag: 0.163.2
  pullPolicy: IfNotPresent
command:
  name: otelcol-contrib
resources:
  requests: { cpu: 100m, memory: 256Mi }
  limits: { cpu: 500m, memory: 512Mi }
enableConfigChecksumAnnotation: true
ports:
  otlp:
    enabled: true
    containerPort: 4317
    servicePort: 4317
    protocol: TCP
    appProtocol: grpc
  otlp-http:
    enabled: true
    containerPort: 4318
    servicePort: 4318
    protocol: TCP
  health-check:
    enabled: true
    containerPort: 13133
    servicePort: 13133
    protocol: TCP
  int-metrics:
    enabled: true
    containerPort: 8888
    servicePort: 8888
    protocol: TCP
  app-metrics:
    enabled: true
    containerPort: 8889
    servicePort: 8889
    protocol: TCP
  jaeger-compact: { enabled: false }
  jaeger-thrift: { enabled: false }
  jaeger-grpc: { enabled: false }
  zipkin: { enabled: false }
config:
  extensions:
    health_check: { endpoint: "${env:MY_POD_IP}:13133" }
  receivers:
  # Bug fixed
    # jaeger: null
    # prometheus: null
    # zipkin: null
    otlp:
      protocols:
        grpc: { endpoint: "${env:MY_POD_IP}:4317" }
        http: { endpoint: "${env:MY_POD_IP}:4318" }
  processors:
    memory_limiter: { check_interval: 1s, limit_mib: 512 }
    batch: { timeout: 1s, send_batch_size: 1024 }
  exporters:
  # Bug fixed
    # debug: null
    otlp_grpc/tempo:
      endpoint: tempo.observability.svc.cluster.local:4317
      tls: { insecure: true }
    prometheus: { endpoint: "${env:MY_POD_IP}:8889" }
    otlp_http/loki:
      endpoint: http://loki.observability.svc.cluster.local:3100/otlp
      tls: { insecure: true }
  service:
    telemetry:
      metrics:
        readers:
          - pull:
              exporter:
              # Bug fixed
                prometheus:
                  host: "${env:MY_POD_IP}"
                  port: 8888
                  without_type_suffix: false
    extensions: [health_check]
    pipelines:
      traces:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [otlp_grpc/tempo]
      metrics:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [prometheus]
      logs:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [otlp_http/loki]
startupProbe:
  httpGet: { path: /, port: 13133 }
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 30
livenessProbe:
  httpGet: { path: /, port: 13133 }
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6
readinessProbe:
  httpGet: { path: /, port: 13133 }
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6

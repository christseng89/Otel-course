apiVersion: apps/v1
kind: Deployment
metadata: { name: frontend }
spec:
  replicas: {{ .Values.replicas.frontend }}
  selector: { matchLabels: { app.kubernetes.io/name: frontend } }
  template:
    metadata: { labels: { app.kubernetes.io/name: frontend } }
    spec:
      containers:
        - name: frontend
          image: {{ .Values.images.frontend }}
          ports: [{ name: http, containerPort: 3000 }]
          env:
            - { name: REDIS_HOST, value: redis }
            - { name: REDIS_PORT, value: "6379" }
            - { name: PORT, value: "3000" }
            - { name: LOG_LEVEL, value: info }
            - { name: SOURCE_LANGUAGE, value: en }
            - { name: OTEL_SERVICE_NAME, value: translation-frontend }
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: {{ .Values.otelEndpoint | quote }} }
            - { name: NODE_OPTIONS, value: --experimental-loader=@opentelemetry/instrumentation/hook.mjs }
          readinessProbe: { httpGet: { path: /, port: http } }
          livenessProbe: { httpGet: { path: /, port: http } }
---
apiVersion: v1
kind: Service
metadata: { name: frontend }
spec:
  selector: { app.kubernetes.io/name: frontend }
  ports: [{ name: http, port: 3000, targetPort: http }]

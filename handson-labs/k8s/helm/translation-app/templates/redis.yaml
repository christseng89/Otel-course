apiVersion: apps/v1
kind: Deployment
metadata: { name: redis }
spec:
  replicas: {{ .Values.replicas.redis }}
  selector: { matchLabels: { app.kubernetes.io/name: redis } }
  template:
    metadata: { labels: { app.kubernetes.io/name: redis } }
    spec:
      containers:
        - name: redis
          image: {{ .Values.images.redis }}
          ports: [{ name: redis, containerPort: 6379 }]
          readinessProbe: { exec: { command: [redis-cli, ping] } }
          livenessProbe: { exec: { command: [redis-cli, ping] } }
---
apiVersion: v1
kind: Service
metadata: { name: redis }
spec:
  selector: { app.kubernetes.io/name: redis }
  ports: [{ name: redis, port: 6379, targetPort: redis }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: redis-exporter }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: redis-exporter } }
  template:
    metadata: { labels: { app.kubernetes.io/name: redis-exporter } }
    spec:
      containers:
        - name: redis-exporter
          image: {{ .Values.images.redisExporter }}
          env: [{ name: REDIS_ADDR, value: redis://redis:6379 }]
          ports: [{ name: metrics, containerPort: 9121 }]
---
apiVersion: v1
kind: Service
metadata: { name: redis-exporter }
spec:
  selector: { app.kubernetes.io/name: redis-exporter }
  ports: [{ name: metrics, port: 9121, targetPort: metrics }]

server: { http_listen_port: 3200 }
distributor:
  receivers:
    otlp:
      protocols:
        grpc: { endpoint: 0.0.0.0:4317 }
        http: { endpoint: 0.0.0.0:4318 }
storage:
  trace:
    backend: local
    local: { path: /var/tempo/traces }
    wal: { path: /var/tempo/wal }
query_frontend: { search: { max_duration: 0s } }
ingester: { max_block_duration: 5m }
compactor: { compaction: { block_retention: {{ .Values.tempo.retention }} } }
metrics_generator:
  storage: { path: /var/tempo/generator/wal }
  traces_storage: { path: /var/tempo/generator/traces }
  processor: { local_blocks: { filter_server_spans: false } }
overrides: { defaults: { metrics_generator: { processors: [local-blocks] } } }

global:
  scrape_interval: 15s
  evaluation_interval: 15s
scrape_configs:
  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]
  - job_name: loki
    static_configs: [{ targets: ["loki.observability.svc.cluster.local:3100"] }]
  - job_name: tempo
    static_configs: [{ targets: ["tempo.observability.svc.cluster.local:3200"] }]
  - job_name: grafana
    static_configs: [{ targets: ["grafana.observability.svc.cluster.local:3000"] }]
  - job_name: otel-collector-internal
    kubernetes_sd_configs:
      - role: pod
        namespaces: { names: [observability] }
    relabel_configs:
      - { source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_instance], action: keep, regex: otel-collector }
      - { source_labels: [__meta_kubernetes_pod_container_port_name], action: keep, regex: int-metrics }
  - job_name: otel-collector-application
    kubernetes_sd_configs:
      - role: pod
        namespaces: { names: [observability] }
    relabel_configs:
      - { source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_instance], action: keep, regex: otel-collector }
      - { source_labels: [__meta_kubernetes_pod_container_port_name], action: keep, regex: app-metrics }
  - job_name: redis
    static_configs: [{ targets: ["redis-exporter.app.svc.cluster.local:9121"] }]
  - job_name: kube-state-metrics
    static_configs: [{ targets: ["kube-state-metrics.observability.svc.cluster.local:8080"] }]

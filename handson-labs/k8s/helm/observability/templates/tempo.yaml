apiVersion: apps/v1
kind: Deployment
metadata: { name: tempo }
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector: { matchLabels: { app.kubernetes.io/name: tempo } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: tempo }
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmaps.yaml") . | sha256sum }}
    spec:
      containers:
        - name: tempo
          image: {{ .Values.images.tempo }}
          args: [-config.file=/etc/tempo/tempo.yaml, -target=all]
          resources:
            {{- toYaml .Values.tempo.resources | nindent 12 }}
          ports:
            - { name: http, containerPort: 3200 }
            - { name: otlp-grpc, containerPort: 4317 }
            - { name: otlp-http, containerPort: 4318 }
          startupProbe:
            httpGet: { path: /ready, port: http }
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /ready, port: http }
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet: { path: /ready, port: http }
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 12
          volumeMounts:
            - { name: config, mountPath: /etc/tempo/tempo.yaml, subPath: tempo-config.yaml }
            - { name: data, mountPath: /var/tempo }
      volumes:
        - { name: config, configMap: { name: tempo-config } }
        - { name: data, persistentVolumeClaim: { claimName: tempo-data } }
---
apiVersion: v1
kind: Service
metadata: { name: tempo }
spec:
  selector: { app.kubernetes.io/name: tempo }
  ports:
    - { name: http, port: 3200, targetPort: http }
    - { name: otlp-grpc, port: 4317, targetPort: otlp-grpc }
    - { name: otlp-http, port: 4318, targetPort: otlp-http }

{{- $class := .Values.storage.className }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: prometheus-data }
spec:
  accessModes: [ReadWriteOnce]
  {{ if $class }}storageClassName: {{ $class | quote }}{{ end }}
  resources: { requests: { storage: {{ .Values.storage.prometheusSize }} } }

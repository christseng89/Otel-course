apiVersion: apps/v1
kind: Deployment
metadata: { name: grafana }
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector: { matchLabels: { app.kubernetes.io/name: grafana } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: grafana }
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmaps.yaml") . | sha256sum }}
    spec:
      containers:
        - name: grafana
          image: {{ .Values.images.grafana }}
          env:
            - { name: GF_AUTH_ANONYMOUS_ENABLED, value: "true" }
            - { name: GF_AUTH_ANONYMOUS_ORG_ROLE, value: Admin }
            - { name: GF_SECURITY_ADMIN_PASSWORD, value: {{ .Values.grafana.adminPassword | quote }} }
          ports: [{ name: http, containerPort: 3000 }]
          startupProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          volumeMounts:
            - { name: config, mountPath: /etc/grafana/provisioning/datasources/datasources.yaml, subPath: datasources.yaml }
            - { name: data, mountPath: /var/lib/grafana }
      volumes:
        - { name: config, configMap: { name: grafana-datasources } }
        - { name: data, persistentVolumeClaim: { claimName: grafana-data } }
---
apiVersion: v1
kind: Service
metadata: { name: grafana }
spec:
  selector: { app.kubernetes.io/name: grafana }
  ports: [{ name: http, port: 3000, targetPort: http }]

apiVersion: v1
kind: ServiceAccount
metadata: { name: kube-state-metrics }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: kube-state-metrics }
rules:
  - apiGroups: [""]
    resources: [nodes, pods, services, namespaces, replicationcontrollers]
    verbs: [list, watch]
  - apiGroups: [apps]
    resources: [deployments, replicasets, statefulsets, daemonsets]
    verbs: [list, watch]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: kube-state-metrics }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: kube-state-metrics }
subjects: [{ kind: ServiceAccount, name: kube-state-metrics, namespace: observability }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: kube-state-metrics }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: kube-state-metrics } }
  template:
    metadata: { labels: { app.kubernetes.io/name: kube-state-metrics } }
    spec:
      serviceAccountName: kube-state-metrics
      containers:
        - name: kube-state-metrics
          image: {{ .Values.images.kubeStateMetrics }}
          ports: [{ name: metrics, containerPort: 8080 }]
---
apiVersion: v1
kind: Service
metadata: { name: kube-state-metrics }
spec:
  selector: { app.kubernetes.io/name: kube-state-metrics }
  ports: [{ name: metrics, port: 8080, targetPort: metrics }]
